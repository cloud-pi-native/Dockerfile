name: Build and push images

on:
  workflow_call:
    inputs:
      REGISTRY:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      IMAGES:
        required: false
        type: string
      BUILD_AMD64:
        required: true
        type: boolean
      BUILD_ARM64:
        required: true
        type: boolean
      USE_QEMU:
        required: true
        type: boolean
      REF:
        description: Exact Git ref to build (empty uses the calling workflow ref)
        required: false
        type: string
        default: ''
      FORCE_REBUILD:
        description: Build and publish even when the target tag already exists
        required: false
        type: boolean
        default: false
      VERIFY_RUNNER:
        description: Check runner tools and browsers before publishing tags (native builds only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  infos:
    name: Generate matrix for build
    runs-on: ubuntu-24.04
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.BUILD_MATRIX }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.REF }}

    - name: Generate matrix for build
      id: build-matrix
      run: |
        if [ ! -z "${{ inputs.IMAGES }}" ]; then
          JQ_FILTER=$(echo "${{ inputs.IMAGES }}" | jq -R 'split(",")')
          echo "BUILD_MATRIX=$(jq -c --argjson images "$JQ_FILTER" '[.[] | select(.name | IN($images[]))]' < ./ci/matrix.json)" >> "$GITHUB_OUTPUT"
        else
          echo "BUILD_MATRIX=$(jq -c '.' < ./ci/matrix.json)" >> "$GITHUB_OUTPUT"
        fi

  build:
    name: Build images
    runs-on: ${{ matrix.runners }}
    permissions:
      contents: read
      packages: write
    needs:
    - infos
    strategy:
      matrix:
        runners: ${{ (inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && !inputs.USE_QEMU && fromJson('["ubuntu-24.04", "ubuntu-24.04-arm"]')) || (inputs.BUILD_ARM64 && !inputs.USE_QEMU && fromJson('["ubuntu-24.04-arm"]')) || fromJson('["ubuntu-24.04"]') }}
        images: ${{ fromJSON(needs.infos.outputs.build-matrix) }}
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.REGISTRY }}
        username: ${{ inputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        password: ${{ inputs.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
        logout: true

    - name: Get image status
      id: image-status
      env:
        FORCE_REBUILD: ${{ inputs.FORCE_REBUILD }}
        REGISTRY: ${{ inputs.REGISTRY }}
        NAMESPACE: ${{ inputs.NAMESPACE }}
        IMAGE_NAME: ${{ matrix.images.name }}
        IMAGE_TAG: ${{ matrix.images.build.tag }}
        BUILD_AMD64: ${{ inputs.BUILD_AMD64 }}
        BUILD_ARM64: ${{ inputs.BUILD_ARM64 }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$FORCE_REBUILD" == "true" ]; then
          echo "NEEDS_BUILD=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        IMAGE_STATUS=$(curl --head --silent --write-out '%{http_code}' --output /dev/null \
          -H "Authorization: Bearer $(printf '%s' "$REGISTRY_TOKEN" | base64 -w 0)" \
          "https://$REGISTRY/v2/$NAMESPACE/$IMAGE_NAME/manifests/$IMAGE_TAG")
        if [ "$IMAGE_STATUS" == "404" ]; then
          NEEDS_BUILD=true
        else
          NEEDS_BUILD=$(curl --silent \
            -H "Authorization: Bearer $(printf '%s' "$REGISTRY_TOKEN" | base64 -w 0)" \
            "https://$REGISTRY/v2/$NAMESPACE/$IMAGE_NAME/manifests/$IMAGE_TAG" \
            | jq --argjson amd64 "$BUILD_AMD64" --argjson arm64 "$BUILD_ARM64" \
              '[.manifests[].platform.architecture] as $archs |
               ($amd64 and ($archs | index("amd64") | not)) or
               ($arm64 and ($archs | index("arm64") | not))')
        fi
        echo "NEEDS_BUILD=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"

    - name: Checks-out repository
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.REF }}

    - name: Set up Docker buildx
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU (for multi platform build)
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' && inputs.USE_QEMU }}
      uses: docker/setup-qemu-action@v3

    - name: Build docker image
      id: build
      uses: docker/build-push-action@v6
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      with:
        context: ${{ matrix.images.build.context }}
        file: ${{ matrix.images.build.dockerfile }}
        target: ${{ matrix.images.build.target }}
        pull: true
        platforms: ${{ (inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && inputs.USE_QEMU && 'linux/amd64,linux/arm64') || ((contains(matrix.runners, '-arm') || (inputs.BUILD_ARM64 && !inputs.BUILD_AMD64)) && 'linux/arm64') || 'linux/amd64' }}
        outputs: type=image,name=${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ matrix.images.name }},push-by-digest=true,name-canonical=true,push=true
        provenance: false
        build-args: |
          BASE_IMAGE=${{ matrix.images.build.base }}

    - name: Verify runner tools and Playwright browsers
      if: ${{ inputs.VERIFY_RUNNER && steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      env:
        IMAGE: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ matrix.images.name }}@${{ steps.build.outputs.digest }}
      run: |
        if [ "${{ inputs.USE_QEMU }}" == "true" ]; then
          echo "Runner verification requires native architecture builds" >&2
          exit 1
        fi
        docker run --rm -i --entrypoint bash "$IMAGE" -s < ci/check-actions-runner-pw.sh

    - name: Export digest
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      run: |
        mkdir -p /tmp/digests/${{ matrix.images.name }}-v${{ matrix.images.build.tag }}
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${{ matrix.images.name }}-v${{ matrix.images.build.tag }}/${digest#sha256:}"

    - name: Upload digest
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.images.name }}-v${{ matrix.images.build.tag }}-${{ (inputs.BUILD_AMD64 && inputs.BUILD_ARM64 && inputs.USE_QEMU && 'multiarch') || ((contains(matrix.runners, '-arm') || (inputs.BUILD_ARM64 && !inputs.BUILD_AMD64)) && 'linux-arm64') || 'linux-amd64' }}
        path: /tmp/digests/${{ matrix.images.name }}-v${{ matrix.images.build.tag }}/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Merge digest
    runs-on: ubuntu-24.04
    needs:
    - infos
    - build
    strategy:
      matrix:
        images: ${{ fromJSON(needs.infos.outputs.build-matrix) }}
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.REGISTRY }}
        username: ${{ inputs.REGISTRY == 'ghcr.io' && github.actor || secrets.REGISTRY_USERNAME }}
        password: ${{ inputs.REGISTRY == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD }}
        logout: true

    - name: Get image status
      id: image-status
      env:
        FORCE_REBUILD: ${{ inputs.FORCE_REBUILD }}
        REGISTRY: ${{ inputs.REGISTRY }}
        NAMESPACE: ${{ inputs.NAMESPACE }}
        IMAGE_NAME: ${{ matrix.images.name }}
        IMAGE_TAG: ${{ matrix.images.build.tag }}
        BUILD_AMD64: ${{ inputs.BUILD_AMD64 }}
        BUILD_ARM64: ${{ inputs.BUILD_ARM64 }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$FORCE_REBUILD" == "true" ]; then
          echo "NEEDS_BUILD=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        IMAGE_STATUS=$(curl --head --silent --write-out '%{http_code}' --output /dev/null \
          -H "Authorization: Bearer $(printf '%s' "$REGISTRY_TOKEN" | base64 -w 0)" \
          "https://$REGISTRY/v2/$NAMESPACE/$IMAGE_NAME/manifests/$IMAGE_TAG")
        if [ "$IMAGE_STATUS" == "404" ]; then
          NEEDS_BUILD=true
        else
          NEEDS_BUILD=$(curl --silent \
            -H "Authorization: Bearer $(printf '%s' "$REGISTRY_TOKEN" | base64 -w 0)" \
            "https://$REGISTRY/v2/$NAMESPACE/$IMAGE_NAME/manifests/$IMAGE_TAG" \
            | jq --argjson amd64 "$BUILD_AMD64" --argjson arm64 "$BUILD_ARM64" \
              '[.manifests[].platform.architecture] as $archs |
               ($amd64 and ($archs | index("amd64") | not)) or
               ($arm64 and ($archs | index("arm64") | not))')
        fi
        echo "NEEDS_BUILD=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"

    - name: Get image tags
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      id: image-tags
      run: |
        MAJOR_TAG="$(echo '${{ matrix.images.build.tag }}' | cut -d '.' -f 1)"
        MINOR_TAG="$(echo '${{ matrix.images.build.tag }}' | cut -d '.' -f 2)"
        PATCH_TAG="$(echo '${{ matrix.images.build.tag }}' | cut -d '.' -f 3)"

        echo "MAJOR_TAG: $MAJOR_TAG"
        echo "MINOR_TAG: $MINOR_TAG"
        echo "PATCH_TAG: $PATCH_TAG"

        {
          echo "MAJOR_TAG=$MAJOR_TAG"
          echo "MINOR_TAG=$MINOR_TAG"
          echo "PATCH_TAG=$PATCH_TAG"
        } >> "$GITHUB_OUTPUT"

    - name: Download digests
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      uses: actions/download-artifact@v4
      with:
        pattern: digests-${{ matrix.images.name }}-v${{ matrix.images.build.tag }}-*
        path: /tmp/digests/${{ matrix.images.name }}-v${{ matrix.images.build.tag }}
        merge-multiple: true

    - name: Set up Docker Buildx
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      uses: docker/setup-buildx-action@v3

    - name: Docker meta
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ matrix.images.name }}
        tags: |
          type=raw,value=${{ steps.image-tags.outputs.MAJOR_TAG }}.${{ steps.image-tags.outputs.MINOR_TAG }}.${{ steps.image-tags.outputs.PATCH_TAG }},enable=true
          type=raw,value=${{ steps.image-tags.outputs.MAJOR_TAG }}.${{ steps.image-tags.outputs.MINOR_TAG }},enable=true
          type=raw,value=${{ steps.image-tags.outputs.MAJOR_TAG }},enable=true
          type=raw,value=latest,enable=${{ matrix.images.build.latest && true || false }}

    - name: Create manifest list and push
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      working-directory: /tmp/digests/${{ matrix.images.name }}-v${{ matrix.images.build.tag }}
      run: |
        mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        tag_args=()
        for tag in "${tags[@]}"; do
          tag_args+=(-t "$tag")
        done
        sources=()
        for digest in *; do
          sources+=("${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ matrix.images.name }}@sha256:$digest")
        done
        docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

    - name: Inspect image
      if: ${{ steps.image-status.outputs.NEEDS_BUILD == 'true' }}
      run: |
        docker buildx imagetools inspect ${{ inputs.REGISTRY }}/${{ inputs.NAMESPACE }}/${{ matrix.images.name }}:${{ steps.meta.outputs.version }}
